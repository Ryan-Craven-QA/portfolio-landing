# ─────────────────────────────────────────────────────────────────────────────
#  PRODUCT LINES
#  Each entry is one product line ("business"). Visitors see these as product
#  lines; internal strategy never appears on the site.
#
#  visible   true  → listed on the site, gets its own page at /products/<id>/
#            false → hidden everywhere, and so are all of its products
#  status    exploring | in-development | coming-soon | early-access | available
#            Anything but "available" shows as a badge, so a line is never
#            presented as operational before it is.
#  hue       0–360 on the OKLCH colour wheel; drives the line's accent colour.
#  glyph     flow | plug | calendar | grid | shield
#  art       document-fields | plugin-toggles | calendar-grid | file-stack | message-check
#
#  Launching with a single line: set `visible: false` on the others.
# ─────────────────────────────────────────────────────────────────────────────

- id: operations-software
  name: Operations Software
  tagline: AI-assisted tools that take repetitive admin off your plate.
  description: >-
    Software for small businesses that handles the busywork around documents and
    workflows — pulling details out of files, organizing information, and moving
    routine tasks along without manual copy-and-paste.
  visible: true
  status: in-development
  order: 10
  hue: 255
  glyph: flow
  art: document-fields
  audience: Small businesses and lean operations teams
  examples:
    - AI-assisted document processing
    - Business workflow automation
    - Reusable automation packages
    - Industry-specific productivity tools

