# ─────────────────────────────────────────────────────────────────────────────
#  PRODUCT LINES
#  The site currently runs in single-product mode (homepage: 'product' in
#  src/config/site.ts): the homepage is the RenewalTrail landing page and no
#  product line is public, so no catalog pages are built.
#
#  visible   true  → listed on the site, gets its own page at /products/<id>/
#            false → hidden everywhere, and so are all of its products
#  status    exploring | in-development | coming-soon | early-access | available
#  hue       0–360 on the OKLCH colour wheel; drives the line's accent colour.
#  glyph     flow | plug | calendar | grid | shield
#  art       document-fields | plugin-toggles | calendar-grid | file-stack | message-check
#
#  When the RenewalTrail Starter Kit is ready to sell: set `visible: true` on
#  the renewaltrail line and `visibility: public` + `availability: available`
#  on src/content/products/renewaltrail-starter-kit.md. The catalog pages
#  (/products/…) then appear automatically.
# ─────────────────────────────────────────────────────────────────────────────

- id: renewaltrail
  name: RenewalTrail
  tagline: Vendor document renewal tracking for small property-management companies.
  description: >-
    Track vendor document expiration dates, renewal requests, and who owns each
    follow-up — starting with a spreadsheet Starter Kit.
  visible: false
  status: exploring
  order: 1
  hue: 200
  glyph: calendar
  art: calendar-grid
  audience: Independent property-management companies working with 10–100 vendors
  disclaimer: >-
    RenewalTrail is an administrative tracking tool. It does not verify
    insurance coverage, determine legal compliance, or certify vendor
    eligibility.
  examples:
    - Vendor document tracker (Excel and Google Sheets)
    - Renewal request templates
    - Setup and weekly-routine guide

