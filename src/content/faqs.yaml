- id: availability
  category: general
  status: published
  order: 10
  question: Is RenewalTrail available now?
  answer: >-
    Not yet. We are talking with independent property managers before building
    anything. The first planned release is the Starter Kit — a spreadsheet
    tracker with renewal request templates and a setup guide. Request early
    access to hear when it is ready, or to take part in a short interview.
  link:
    label: Request early access
    href: /#register

- id: verification
  category: products
  status: published
  order: 20
  question: Does RenewalTrail verify insurance certificates or compliance?
  answer: >-
    No. RenewalTrail is an administrative tracking tool: it keeps expiration
    dates, renewal requests, owners and next steps in one place. It does not
    verify insurance coverage, determine legal compliance, or certify that a
    vendor is eligible to work.


    Your team reviews the documents themselves. What you require from vendors
    should come from your own policies, contracts and professional advisers.

- id: starter-kit-contents
  category: products
  status: published
  order: 30
  question: What will the Starter Kit include?
  answer: >-
    A tracker workbook for Excel and Google Sheets (vendors, documents,
    expiration dates, statuses, owners and a follow-up log), ready-to-edit
    renewal request templates, and a setup guide with a weekly review routine.
    The exact contents may change based on what we learn in interviews.

- id: automatic-emails
  category: products
  status: published
  order: 40
  question: Will it send reminders or emails automatically?
  answer: >-
    No. The Starter Kit shows what is due and who owns it; you send renewal
    requests yourself using the templates. Automatic reminders would only be
    considered for a future software version, if early users need them.

- id: data-storage
  category: general
  status: published
  order: 50
  question: Where would my vendor data be stored?
  answer: >-
    In your own file — an Excel workbook on your computer or network, or a
    Google Sheet in your own account. We would not receive or store your vendor
    data.

- id: pm-software
  category: products
  status: published
  order: 60
  question: Will it work with my property-management software?
  answer: >-
    The Starter Kit is a standalone spreadsheet with no integrations. If your
    software can export a vendor list to CSV or Excel, you can paste it in to
    get started.

- id: vendor-count
  category: products
  status: published
  order: 70
  question: Is it a good fit if we work with more than 100 vendors?
  answer: >-
    The Starter Kit is designed for roughly 10 to 100 vendors. A spreadsheet
    can hold more, but larger operations usually need things a spreadsheet
    does not offer well, such as per-property permissions and an audit trail.

- id: pricing
  category: purchasing
  status: published
  order: 80
  question: How much will it cost?
  answer: >-
    The Starter Kit is planned as a one-time purchase, with a founding price
    for early-access participants. Nothing is for sale yet, and planned prices
    may change before launch.
  link:
    label: See planned pricing
    href: /#pricing

- id: interviews
  category: general
  status: published
  order: 90
  question: What happens in a research interview?
  answer: >-
    A 20-minute call about how you track vendor documents today — what works,
    what slips, and who handles follow-ups. At the end we may show the demo
    and, if it looks useful, explain the founding offer. There is no
    obligation.
  link:
    label: Request an interview
    href: /#register

- id: contact
  category: support
  status: published
  order: 100
  question: How do I get in touch?
  answer: >-
    Use the contact page for general questions, or the early-access form to
    request access or an interview.
  link:
    label: Contact us
    href: /contact/

